<section class="auth-page">
  <div class="auth-card surface">
    <header class="auth-header">
      <span class="auth-logo">📚</span>
      <h1>Welcome back</h1>
      <p class="muted">Log in to borrow and review books.</p>
    </header>

    <!-- 401 from server -->
    <div class="alert alert-danger">
      <div class="alert-body">Invalid email or password.</div>
    </div>

    <!-- When redirected by the authGuard -->
    <div class="alert alert-info">
      <div class="alert-body">Please log in to continue.</div>
    </div>

    <form class="stack" novalidate>
      <div class="form-field">
        <label class="required" for="email">Email</label>
        <input id="email" class="input" type="email" placeholder="you@example.com" autocomplete="email" />
        <app-field-error />
      </div>

      <div class="form-field">
        <div class="row">
          <label class="required" for="password">Password</label>
          <span class="spacer"></span>
          <button class="link-btn" type="button">Show</button>
        </div>
        <input id="password" class="input" type="password" placeholder="••••••••" autocomplete="current-password" />
        <app-field-error />
      </div>

      <label class="checkbox">
        <input type="checkbox" />
        <span>Remember me</span>
      </label>

      <button class="btn btn-primary btn-lg btn-block" type="submit">Log in</button>
      <!-- while submitting -->
      <button class="btn btn-primary btn-lg btn-block" type="submit" disabled>
        <span class="spinner spinner-light"></span> Logging in…
      </button>
    </form>

    <div class="demo-accounts">
      <p class="small muted">Demo accounts (click to fill):</p>
      <div class="row">
        <button class="chip" type="button">admin&#64;library.dev</button>
        <button class="chip" type="button">member&#64;library.dev</button>
      </div>
    </div>

    <p class="auth-footer">Don't have an account? <a href="/register">Create one</a></p>
  </div>
</section>
