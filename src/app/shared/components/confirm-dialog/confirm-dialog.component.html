<!-- Inputs: title, message, confirmText, danger(bool). Outputs: confirmed, cancelled.
     Tip: you can also try the native <dialog> element with viewChild + showModal(). -->
<div class="backdrop">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog-icon">!</div>
    <h2 class="dialog-title" id="dialog-title">Delete book?</h2>
    <p class="dialog-message">
      "Clean Code" will be permanently removed together with its reviews. This action can't be undone.
    </p>
    <div class="dialog-actions">
      <button class="btn btn-secondary" type="button">Cancel</button>
      <button class="btn btn-danger" type="button">Delete</button>
    </div>
  </div>
</div>
